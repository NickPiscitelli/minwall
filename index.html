<style>
/* Layout: full-bleed canvas; glass transport bar on top and glass control rail float over it, fading out when idle */
:root {
  --ink: #16171f;
  --glass: rgba(30, 31, 41, 0.58);
  --glass-strong: rgba(30, 31, 41, 0.82);
  --raise: rgba(68, 71, 90, 0.55);
  --line: rgba(139, 150, 196, 0.22);
  --fg: #f8f8f2;
  --muted: #a2a8c6;
  --accent: #bd93f9;
  --accent-ink: #1e1f29;
  --danger: #ff5555;
  --ui: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  --display: "Unbounded", "Arial Black", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0 }
body { background: var(--ink); color: var(--fg); font: 14px/1.45 var(--ui); overflow: hidden }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); box-shadow: 0 12px 40px rgba(0,0,0,.35) }
.fade { transition: opacity .45s ease, transform .45s ease }
body.idle .fade, body.hideui .fade { opacity: 0; pointer-events: none }
body.idle header.bar, body.hideui header.bar { transform: translateY(-8px) }
body.idle aside, body.hideui aside { transform: translateX(-10px) }
body.idle { cursor: none }

header.bar { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; flex-wrap: wrap }
.brand { font: 900 16px/1 var(--display); letter-spacing: .01em; white-space: nowrap }
.brand span { color: var(--accent) }
.transport { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 240px }
#scrub { flex: 1 }
.time { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 96px; text-align: right }
.actions { display: flex; gap: 6px; flex-wrap: wrap }
button { font: 500 13px var(--ui); color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap }
button:hover { border-color: rgba(189,147,249,.5) }
button:disabled { opacity: .5; cursor: default }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
button.icon { width: 34px; padding: 6px 0; font-family: var(--mono) }
button[aria-pressed=true] { border-color: var(--accent); color: var(--accent) }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
kbd { font: 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 5px }
button.primary kbd { color: var(--accent-ink); border-color: rgba(0,0,0,.25) }

.app { display: contents }
aside { position: fixed; z-index: 4; top: calc(76px + env(safe-area-inset-top, 0px)); left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 340px; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; scrollbar-width: thin }
details.sec { border-bottom: 1px solid var(--line) }
details.sec:last-child { border-bottom: 0 }
details.sec > summary { list-style: none; cursor: pointer; padding: 12px 16px; font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; user-select: none }
details.sec > summary::-webkit-details-marker { display: none }
details.sec > summary::after { content: "+" }
details.sec[open] > summary::after { content: "–" }
details.sec[open] > summary { color: var(--fg) }
.body { padding: 0 16px 16px; display: grid; gap: 10px }
.row { display: grid; grid-template-columns: 88px 1fr 46px; align-items: center; gap: 8px; min-width: 0 }
.row.wide { grid-template-columns: 88px 1fr }
.row > label { color: var(--muted); font-size: 12.5px }
.row output { font: 11.5px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums }
.row .pair { display: flex; gap: 6px; align-items: center; min-width: 0 }
.check { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 13px; cursor: pointer }
select, input[type=text], input[type=number], input[type=password], input[type=search], textarea { width: 100%; min-width: 0; background: rgba(22,23,31,.6); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: 13px var(--ui) }
select option { background: #282a36 }
textarea { font: 12px/1.4 var(--mono); resize: vertical }
input[type=range] { width: 100%; accent-color: var(--accent) }
input[type=checkbox] { accent-color: var(--accent); margin: 0 }
.hint { color: var(--muted); font-size: 12px; margin: 0 }
.btns { display: flex; gap: 6px; flex-wrap: wrap }
.btns > button { flex: 1 }

.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; background: rgba(22,23,31,.5) }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 5px 0 }
.tabs button[aria-selected=true] { background: var(--raise); color: var(--fg) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 11.5px var(--mono); padding: 3px 8px; border-radius: 99px; background: rgba(22,23,31,.5); border: 1px solid var(--line); color: var(--muted) }
.chip:hover { color: var(--fg) }
.chip .x { margin-left: 6px; opacity: .6 }
.drop { border: 1.5px dashed var(--line); border-radius: 9px; padding: 18px 12px; text-align: center; color: var(--muted); font-size: 13px; transition: border-color .15s, background .15s }
.drop.over { border-color: var(--accent); background: rgba(189,147,249,.08); color: var(--fg) }
.srcinfo { font: 11.5px/1.5 var(--mono); color: var(--muted); background: rgba(22,23,31,.5); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-wrap: anywhere }
.srcinfo b { color: var(--fg); font-weight: 500 }
.files { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; background: rgba(22,23,31,.5) }
.files label { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; padding: 3px 8px; font: 11.5px var(--mono); color: var(--muted); cursor: pointer }
.files label:hover { background: var(--raise) }
.files label.on { color: var(--fg) }
.files label span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left }
.files label span:last-child { font-variant-numeric: tabular-nums; opacity: .7 }

main.stage { position: fixed; inset: 0; background: var(--ink) }
#cv { width: 100%; height: 100%; object-fit: contain; display: block }
.info { position: fixed; z-index: 3; left: 364px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font: 11.5px var(--mono); color: var(--muted); pointer-events: none }
.info span { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); padding: 3px 9px; border-radius: 99px; font-variant-numeric: tabular-nums }
body.nopanel aside { opacity: 0; pointer-events: none; transform: translateX(-10px) }
body.nopanel .info { left: 12px }
.busy { position: fixed; z-index: 8; inset: 0; display: grid; place-items: center; background: rgba(15,16,22,.55); backdrop-filter: blur(4px) }
.busy .card { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; width: min(380px, calc(100% - 32px)); display: grid; gap: 12px }
.busy h3 { margin: 0; font: 600 15px var(--ui) }
.bar-track { height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden }
.bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .1s linear }
.busy p { margin: 0; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
#toast { position: fixed; left: 50%; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); max-width: min(460px, calc(100% - 32px)); background: var(--glass-strong); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10 }
#toast.show { opacity: 1; transform: translate(-50%, 0) }
#toast.err { border-color: var(--danger); color: #ffd6d6 }

@media (max-width: 760px) {
  header.bar { left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); gap: 8px }
  .brand { display: none }
  .actions kbd { display: none }
  aside { top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 48vh }
  .info { display: none }
}
@media (prefers-reduced-motion: reduce) { .fade, #toast, .drop { transition: none } }
</style>
</head>

  <div class="transport">
    <button class="icon" id="play" title="Play / pause (Space)" aria-label="Play or pause">❚❚</button>

const SRC_STATE = { label: 'minwall (this page)', repo: null, files: [], candidates: [], selected: new Set() };

function minify(src, ext, level) {

/* auto file select */

async function loadSelected() {

/* GitHub */
let GH_TOKEN = '';
function parseRepo(input) {
  input = input.trim().replace(/\.git$/, '').replace(/^git@github\.com:/, '');

}
async function gh(path) {

  if (GH_TOKEN) headers.Authorization = 'Bearer ' + GH_TOKEN;
  const r = await fetch('https://api.github.com' + path, { headers });
  if (r.status === 403 || r.status === 429) throw new Error(GH_TOKEN ? 'GitHub refused the request (rate limit or token scope).' : 'GitHub rate limit hit (60 requests per hour without a token). Add a token or try again later.');
  if (r.status === 404) throw new Error('Repo or path not found. Check the spelling, or add a token for a private repo.');
  if (r.status === 401) throw new Error('GitHub rejected the token. Check it and try again.');
  if (!r.ok) throw new Error('GitHub error ' + r.status);
  return r.json();
}
async function loadRepo(input) {
  const p = parseRepo(input);
  if (!p) { toast('Enter a repo as owner/name or paste a github.com URL.', true); return; }
  const btn = $('#ghLoad'); btn.disabled = true; btn.textContent = 'Reading repo…';
  try {
    const meta = await gh(`/repos/${p.owner}/${p.repo}`);
    const branch = p.branch || meta.default_branch;
    const treeish = encodeURIComponent(p.sub ? `${branch}:${p.sub}` : branch);
    const tree = await gh(`/repos/${p.owner}/${p.repo}/git/trees/${treeish}?recursive=1`);
    const prefix = p.sub ? p.sub + '/' : '';
    const cands = tree.tree.filter(t => t.type === 'blob').map(t => {
      const full = prefix + t.path;
      return {
        path: t.path, size: t.size || 0,
        load: async () => {
          const enc = full.split('/').map(encodeURIComponent).join('/');
          const r = GH_TOKEN
            ? await fetch(`https://api.github.com/repos/${p.owner}/${p.repo}/contents/${enc}?ref=${encodeURIComponent(branch)}`, { headers: { Accept: 'application/vnd.github.raw', Authorization: 'Bearer ' + GH_TOKEN } })
            : await fetch(`https://raw.githubusercontent.com/${p.owner}/${p.repo}/${encodeURIComponent(branch)}/${enc}`);
          if (!r.ok) throw new Error(r.status);
          return r.text();
        },
      };
    });

    SRC_STATE.label = `${p.owner}/${p.repo}${p.sub ? '/' + p.sub : ''}@${branch}`;
    SRC_STATE.candidates = cands;
    scoreFiles(cands); autoPick();
    if (!S.titleLocked) { S.titleText = (p.sub ? p.sub.split('/').pop() : p.repo); syncControls(); }
    if (tree.truncated) toast('Large repo: GitHub truncated the file list. Point at a subfolder URL for full coverage.', true);
    renderSourcePanel();
    await loadSelected();
  } catch (e) { toast(e.message || String(e), true); }

}

/* local files */
async function entriesToCands(items) {
  const out = [];
  async function walk(entry, prefix) {
    if (out.length > 30000) return;
    if (entry.isFile) {
      const f = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ path: prefix + f.name, size: f.size, load: () => f.text() });
    } else if (entry.isDirectory) {
      const dir = prefix + entry.name + '/';
      if (EXCLUDE_DIR.test(dir)) return;
      const reader = entry.createReader(); let batch;
      do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) await walk(e, dir); } while (batch.length);
    }
  }
  for (const e of items) if (e) await walk(e, '');
  return out;
}
function filesToCands(list) {
  return [...list].filter(f => !EXCLUDE_DIR.test(f.webkitRelativePath || f.name)).map(f => ({ path: f.webkitRelativePath || f.name, size: f.size, load: () => f.text() }));
}

  scoreFiles(cands);
  if (!cands.some(c => c.score > 0)) cands.forEach(c => c.score = c.size < 400000 ? 0.1 : 0);

const cv = $('#cv');

function buildLayout() {

      const s = el('select', { id }, c.options.map(([v, l]) => el('option', { value: v }, l)));
      s.addEventListener('change', () => {
        S[c.key] = coerce(c.key, s.value);
        if (c.key === 'preset' && s.value !== 'custom') { const [w, h] = s.value === 'screen' ? screenDims() : s.value.split('x').map(Number); S.width = w; S.height = h; syncControls(); }
        changed(c.dirty); resumeFor(c);
      });
      row = el('div', { class: 'row wide' }, el('label', { for: id }, c.label), s);
      CTRL_EL.set(c.key, { c, row, set: v => s.value = v });
    } else if (c.type === 'check') {
      const inp = el('input', { type: 'checkbox', id });
      inp.addEventListener('change', () => { S[c.key] = inp.checked; changed(c.dirty); resumeFor(c); });
      row = el('label', { class: 'check', for: id }, inp, c.label);
      CTRL_EL.set(c.key, { c, row, set: v => inp.checked = !!v });
    } else if (c.type === 'textarea') {
      const t = el('textarea', { id, rows: 2, spellcheck: 'false' });
      t.addEventListener('input', () => { S.titleText = t.value; S.titleLocked = true; changed('mask'); });
      row = el('div', { class: 'row wide' }, el('label', { for: id }, c.label), t);
      CTRL_EL.set(c.key, { c, row, set: v => { if (document.activeElement !== t) t.value = v; } });
    } else if (c.type === 'button') {
      row = el('div', { class: 'btns' }, el('button', { onclick: c.run }, c.label));
      CTRL_EL.set(c.key, { c, row, set: () => {} });
    } else if (c.type === 'dims') {
      const w = el('input', { type: 'number', id: 'c_width', min: 64, max: 8192, 'aria-label': 'Width' });
      const h = el('input', { type: 'number', id: 'c_height', min: 64, max: 8192, 'aria-label': 'Height' });
      const swap = el('button', { class: 'icon', title: 'Swap orientation', 'aria-label': 'Swap width and height' }, '⇄');
      const apply = () => {
        const W = clamp(Math.round(+w.value || 0), 64, 8192), H = clamp(Math.round(+h.value || 0), 64, 8192);
        S.width = W; S.height = H; S.preset = SIZES.some(s => s[0] === `${W}x${H}`) ? `${W}x${H}` : 'custom'; syncControls(); changed('size');
      };
      w.addEventListener('change', apply); h.addEventListener('change', apply);
      swap.addEventListener('click', () => { [w.value, h.value] = [h.value, w.value]; apply(); });
      row = el('div', { class: 'row wide' }, el('label', { for: 'c_width' }, 'Pixels'), el('div', { class: 'pair' }, w, el('span', { class: 'hint' }, '×'), h, swap));
      CTRL_EL.set(c.key, { c, row, set: () => { w.value = S.width; h.value = S.height; } });
    }
    host.append(row);
  }
  secs.Export.append(
    el('p', { class: 'hint' }, 'Every motion is built as a seamless loop, so the video repeats with no visible jump. MP4 renders frame by frame at full quality, however long that takes.'),
    el('div', { class: 'btns' }, el('button', { onclick: savePNG }, 'Save PNG'), el('button', { onclick: copyPNG }, 'Copy PNG'), el('button', { class: 'primary', onclick: exportVideo }, 'Export video')),
  );
  buildPresets(secs.Presets);
  syncControls();
}
// turning on a motion effect while paused would otherwise look broken, so resume playback
function resumeFor(c) { if (c.sec === 'Motion' && !playing && animated()) setPlaying(true); }
function syncControls() { for (const [key, o] of CTRL_EL) o.set(S[key]); refreshVisibility(); }
function refreshVisibility() { for (const [, o] of CTRL_EL) o.row.hidden = o.c.show ? !o.c.show() : false; }

async function copyPNG() {
  try {
    await withScale(S.exportScale, async () => {
      renderFrame(phase);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    });
    toast('Copied PNG to the clipboard');
  } catch (e) { toast('Copy failed. Use Save PNG instead.', true); }
}

/* presets */
const LOOK_KEYS = Object.keys(DEFAULTS).filter(k => !['exportScale', 'fps', 'bitrate', 'videoFormat', 'budgetKB', 'pickMode', 'preview', 'titleLocked'].includes(k));
function buildPresets(host) {
  const name = el('input', { type: 'text', id: 'presetName', placeholder: 'Name this look' });
  const list = el('div', { class: 'chips', id: 'presetList' });
  const draw = () => {
    const presets = store.get('presets', {});
    list.replaceChildren(...Object.keys(presets).map(n => el('button', { class: 'chip', title: 'Apply ' + n, onclick: e => {
      if (e.target.classList.contains('x')) { const p = store.get('presets', {}); delete p[n]; store.set('presets', p); draw(); return; }
      Object.assign(S, presets[n]); syncControls(); changed('text'); changed('size'); toast('Applied “' + n + '”');
    } }, n, el('span', { class: 'x', title: 'Delete' }, '×'))));
    if (!list.children.length) list.append(el('span', { class: 'hint' }, 'Saved looks appear here.'));
  };
  const save = () => {
    const n = name.value.trim() || `Look ${Object.keys(store.get('presets', {})).length + 1}`;
    const p = store.get('presets', {}); p[n] = Object.fromEntries(LOOK_KEYS.map(k => [k, S[k]]));
    if (!store.set('presets', p)) { toast('Could not save: browser storage is unavailable.', true); return; }
    name.value = ''; draw(); toast('Saved “' + n + '”');
  };
  const exportJSON = () => download(new Blob([JSON.stringify(Object.fromEntries(LOOK_KEYS.map(k => [k, S[k]])), null, 2)], { type: 'application/json' }), 'minwall-look.json');
  const imp = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: async e => {
    try { const o = JSON.parse(await e.target.files[0].text()); for (const k of LOOK_KEYS) if (k in o) S[k] = coerce(k, o[k]); syncControls(); changed('text'); changed('size'); toast('Imported look'); }
    catch { toast('That file is not a Minwall look (.json).', true); }
  } });
  host.append(
    el('div', { class: 'row wide' }, el('label', { for: 'presetName' }, 'Save as'), el('div', { class: 'pair' }, name, el('button', { onclick: save }, 'Save'))),
    list,
    el('div', { class: 'btns' }, el('button', { onclick: exportJSON }, 'Export .json'), el('button', { onclick: () => imp.click() }, 'Import .json'), imp,
      el('button', { onclick: () => { const keep = { width: S.width, height: S.height, preset: S.preset }; Object.assign(S, DEFAULTS, keep); syncControls(); changed('text'); changed('size'); toast('Reset to defaults'); } }, 'Reset')),
  );
  draw();
}

/* source panel */
let srcTab = store.get('srcTab', 'github'), fileFilter = '';
function setSourceInfo(msg) { const n = $('#srcStatus'); if (n) n.textContent = msg; }
function renderSourcePanel() {
  const host = $('#sourceUI');
  const tabs = el('div', { class: 'tabs', role: 'tablist' }, [['github', 'GitHub'], ['local', 'Local'], ['paste', 'Paste']].map(([k, l]) =>
    el('button', { role: 'tab', 'aria-selected': String(srcTab === k), onclick: () => { srcTab = k; store.set('srcTab', k); renderSourcePanel(); } }, l)));
  let pane;
  if (srcTab === 'github') {
    const repo = el('input', { type: 'text', id: 'ghRepo', placeholder: 'owner/repo or github.com URL', value: store.get('lastRepo', ''), spellcheck: 'false' });
    const tok = el('input', { type: 'password', id: 'ghTok', placeholder: 'Token (optional, private repos / rate limit)', value: GH_TOKEN, autocomplete: 'off' });
    tok.addEventListener('input', () => GH_TOKEN = tok.value.trim());
    const go = () => { store.set('lastRepo', repo.value.trim()); loadRepo(repo.value); };
    repo.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    pane = el('div', { style: 'display:grid;gap:8px' }, repo, tok,
      el('div', { class: 'btns' }, el('button', { id: 'ghLoad', class: 'primary', onclick: go }, 'Load repo')),
      el('div', { class: 'chips' }, ['preactjs/preact', 'BurntSushi/ripgrep', 'psf/requests', 'ggml-org/llama.cpp', 'torvalds/linux/tree/master/kernel/sched'].map(r =>
        el('button', { class: 'chip', onclick: () => { repo.value = r; go(); } }, r.replace('/tree/master/', ':')))),
      el('p', { class: 'hint' }, 'Paste a /tree/branch/folder URL to aim at a subfolder. The token stays in this tab only and is never saved.'));
  } else if (srcTab === 'local') {
    const dirIn = el('input', { type: 'file', webkitdirectory: true, multiple: true, hidden: true, onchange: e => useLocal(filesToCands(e.target.files), (e.target.files[0]?.webkitRelativePath || 'folder').split('/')[0]) });
    const fileIn = el('input', { type: 'file', multiple: true, hidden: true, onchange: e => useLocal(filesToCands(e.target.files), e.target.files.length === 1 ? e.target.files[0].name : `${e.target.files.length} files`) });
    const drop = el('div', { class: 'drop', id: 'drop' }, 'Drop a project folder or files here. node_modules, build output and lockfiles are skipped automatically.');
    pane = el('div', { style: 'display:grid;gap:8px' }, drop, el('div', { class: 'btns' }, el('button', { onclick: () => dirIn.click() }, 'Choose folder'), el('button', { onclick: () => fileIn.click() }, 'Choose files')), dirIn, fileIn);
  } else {
    const ta = el('textarea', { id: 'pasteBox', rows: 6, placeholder: 'Paste any code here', spellcheck: 'false' });
    pane = el('div', { style: 'display:grid;gap:8px' }, ta, el('div', { class: 'btns' }, el('button', { class: 'primary', onclick: () => {
      if (!ta.value.trim()) { toast('Paste some code first.', true); return; }
      SRC_STATE.repo = null; SRC_STATE.candidates = []; setFiles([{ path: 'pasted.js', text: ta.value }], 'pasted code');
    } }, 'Use pasted code')));
  }
  const files = SRC_STATE.files, bytes = files.reduce((a, f) => a + f.text.length, 0);
  const info = el('div', { class: 'srcinfo', id: 'srcStatus' }, el('b', {}, SRC_STATE.label), ` · ${files.length} file${files.length === 1 ? '' : 's'} · ${fmtKB(bytes)}`,
    WORDS.length ? el('div', {}, 'Top words: ' + WORDS.slice(0, 6).map(w => w.word).join(', ')) : null);
  const kids = [tabs, pane, info];
  if (SRC_STATE.candidates.length) {
    const cands = SRC_STATE.candidates;
    const nSel = SRC_STATE.selected.size, selBytes = cands.filter(c => SRC_STATE.selected.has(c.path)).reduce((a, c) => a + c.size, 0);
    const budget = el('input', { type: 'range', id: 'c_budget', min: 20, max: 2000, step: 10, value: S.budgetKB });
    const bOut = el('output', { for: 'c_budget' }, S.budgetKB + 'K');
    budget.addEventListener('input', () => { S.budgetKB = +budget.value; bOut.textContent = S.budgetKB + 'K'; store.set('settings2', S); });
    const filt = el('input', { type: 'search', placeholder: `Filter ${cands.length} files`, value: fileFilter, 'aria-label': 'Filter files' });
    const list = el('div', { class: 'files' });
    const drawList = () => {
      const q = fileFilter.toLowerCase();
      const shown = cands.filter(c => !q || c.path.toLowerCase().includes(q))
        .sort((a, b) => (SRC_STATE.selected.has(b.path) - SRC_STATE.selected.has(a.path)) || (b.score - a.score)).slice(0, 400);
      list.replaceChildren(...shown.map(c => {
        const on = SRC_STATE.selected.has(c.path);
        const cb = el('input', { type: 'checkbox', checked: on, onchange: () => { cb.checked ? SRC_STATE.selected.add(c.path) : SRC_STATE.selected.delete(c.path); lab.classList.toggle('on', cb.checked); } });
        const lab = el('label', { class: on ? 'on' : '', title: c.path }, cb, el('span', {}, c.path), el('span', {}, fmtKB(c.size)));
        return lab;
      }));
    };
    filt.addEventListener('input', () => { fileFilter = filt.value; drawList(); });
    drawList();
    kids.push(
      el('div', { class: 'row' }, el('label', { for: 'c_budget' }, 'Code budget'), budget, bOut),
      el('div', { class: 'btns' },
        el('button', { title: 'Pick the most representative source files within the budget', onclick: () => { autoPick('best'); renderSourcePanel(); loadSelected(); } }, 'Auto-pick'),
        el('button', { title: 'Weighted random pick of good files', onclick: () => { autoPick('random'); renderSourcePanel(); loadSelected(); } }, 'Re-roll'),
        el('button', { class: 'primary', onclick: loadSelected }, `Load ${nSel}`)),
      el('p', { class: 'hint' }, `${nSel} of ${cands.length} files ticked · ${fmtKB(selBytes)}`),
      filt, list);
  }
  host.replaceChildren(...kids);
  const drop = $('#drop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  }
}
// whole-window drop target
window.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
window.addEventListener('drop', async e => {
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault(); $('#drop')?.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  const label = entries.length === 1 ? entries[0].name : `${entries.length} items`;
  const cands = entries.length ? await entriesToCands(entries) : filesToCands(e.dataTransfer.files);
  useLocal(cands, label);
});
window.addEventListener('paste', e => {
  if (e.target.closest('input, textarea')) return;
  const t = e.clipboardData?.getData('text');
  if (t && t.length > 40) { SRC_STATE.repo = null; SRC_STATE.candidates = []; setFiles([{ path: 'pasted.js', text: t }], 'pasted code'); toast('Using pasted code'); }
});

/* transport + keys */
$('#play').addEventListener('click', () => setPlaying(!playing));
$('#scrub').addEventListener('input', e => { setPlaying(false); phase = +e.target.value / 1000; needFrame = true; });
$('#surprise').addEventListener('click', surprise);
$('#savePng').addEventListener('click', savePNG);
$('#saveVid').addEventListener('click', exportVideo);
$('#busyCancel').addEventListener('click', () => { cancelExport = true; });
window.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey || E.busy) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (k === 'r') surprise();
  else if (k === 'p') savePNG();
  else if (k === 'v') exportVideo();
  else if (k === 'f') toggleFullscreen();
  else if (k === 'c') togglePanel();
  else if (k === 'h') toggleUI();
  else if (k === 'escape' && document.body.classList.contains('hideui')) toggleUI();
});

/* overlay chrome: idle fade, toggles, fullscreen, live screen size */
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => toast('Fullscreen is not available here.', true));
}
function togglePanel(force) {
  const hide = force ?? !document.body.classList.contains('nopanel');
  document.body.classList.toggle('nopanel', hide);
  $('#togglePanel').setAttribute('aria-pressed', String(!hide));
  store.set('nopanel', hide);
}
function toggleUI() {
  const on = document.body.classList.toggle('hideui');
  if (on) toast('Overlays hidden. Press H or Esc to bring them back.');
}
$('#fullscreen').addEventListener('click', toggleFullscreen);
$('#togglePanel').addEventListener('click', () => togglePanel());
$('#toggleUI').addEventListener('click', toggleUI);
togglePanel(store.get('nopanel', false));
let idleTimer = 0;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    const busyUI = document.activeElement?.closest?.('aside, header') || $('aside:hover, header:hover') || E.busy;
    if (busyUI) wake(); else document.body.classList.add('idle');
  }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));
wake();
let resizeTimer = 0;
window.addEventListener('resize', () => {
  if (S.preset !== 'screen') return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (S.preset !== 'screen') return;
    const [w, h] = screenDims();
    if (w !== S.width || h !== S.height) { S.width = w; S.height = h; syncControls(); changed('size'); }
  }, 250);
});

/* ───────────────────────── boot ───────────────────────── */
(function boot() {
  if (S.preset === 'screen') [S.width, S.height] = screenDims();
  const saved = store.get('source', null);
  if (saved?.files?.length) { SRC_STATE.files = saved.files; SRC_STATE.label = saved.label; SRC_STATE.repo = saved.repo; }
  else SRC_STATE.files = [{ path: 'minwall/app.js', text: document.getElementById('app').textContent }, { path: 'minwall/style.css', text: document.querySelector('style').textContent }];
  buildPanel();
  processSource();
  renderSourcePanel();
  setPlaying(playing);
  if (!playing) setTimeout(() => toast('Paused because Reduce Motion is on in your system settings. Press Space to play.'), 600);
  rebuild().then(() => requestAnimationFrame(tick));
})();
</script>
